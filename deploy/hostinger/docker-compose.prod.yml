# Hostinger KVM1 production compose for Omen.
# Run from the repo root with:
#   docker compose -f deploy/hostinger/docker-compose.prod.yml up -d
#
# Secrets come from deploy/hostinger/.env.production on the VPS.
# That file is intentionally ignored and must not be committed.
name: omen
services:
  api:
    image: ghcr.io/justinduverge-design/omen:main
    container_name: omen_api
    command: node src/server.js
    env_file:
      # Relative to this compose file: deploy/hostinger/.env.production.
      - .env.production
    environment:
      NODE_ENV: production
      PORT: "3000"
    ports:
      # Localhost only. Nginx is the public HTTPS front door.
      - "127.0.0.1:3000:3000"
    restart: unless-stopped
    # Headroom, so a runaway loop cannot take the host down with it. On 2026-09-05
    # a request loop pegged this container at 99.31% for 13 minutes and the process
    # could not even write a log line.
    #
    # KVM1 was upgraded from 1 to 2 vCPU (3.8 -> 7.9 GB) the same day. The original
    # caps were 0.85 / 1g, sized for ONE core where an uncapped spin starved nginx
    # and the watchdog meant to fix it. On two cores that number would have throttled
    # the API to ~42% of a machine that was just paid for, so it is raised here
    # rather than left behind as a stale safety number.
    #
    # 1.7 of 2 leaves ~0.3 core for nginx, the deploy runner and the watchdog. Node's
    # JS execution is single-threaded, so the event-loop spin this guards against
    # tops out near 1.0 on its own - the second core is now the real safety margin
    # and this cap is the backstop for everything else (GC, libuv threadpool).
    # Steady state measured at ~391 MiB RSS and near-zero CPU at rest.
    cpus: 1.7
    mem_limit: 2g
    pids_limit: 256
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
  cron:
    image: ghcr.io/justinduverge-design/omen-cron:main
    container_name: omen_cron
    env_file:
      # Relative to this compose file: deploy/hostinger/.env.production.
      - .env.production
    environment:
      NODE_ENV: production
      TZ: America/New_York
    restart: unless-stopped
    # Same reasoning as the api service, scaled to the 2-vCPU box. A runaway cron
    # job must not be able to take the public site down with it, and cron is the
    # lower-priority of the two: it can afford to be slow, the API cannot.
    cpus: 1.0
    mem_limit: 1g
    pids_limit: 128
    # No ports: this is a scheduled worker, not an HTTP service.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
networks:
  default:
    name: omen_network
