# Hostinger KVM1 production compose for Omen.
# Run from the repo root with:
#   docker compose -f deploy/hostinger/docker-compose.prod.yml up -d
#
# Secrets come from deploy/hostinger/.env.production on the VPS.
# That file is intentionally ignored and must not be committed.
name: omen
services:
  api:
    image: ghcr.io/justinduverge-design/omen:main
    container_name: omen_api
    command: node src/server.js
    env_file:
      # Relative to this compose file: deploy/hostinger/.env.production.
      - .env.production
    environment:
      NODE_ENV: production
      PORT: "3000"
    ports:
      # Localhost only. Nginx is the public HTTPS front door.
      - "127.0.0.1:3000:3000"
    restart: unless-stopped
    # KVM1 has exactly ONE core. An unbounded runaway loop in this container does
    # not merely slow the box down, it starves everything else on it - nginx, the
    # deploy runner, and any watchdog that might restart this container. Capping
    # below 1.0 is what keeps the host responsive enough to heal itself.
    # Sized against measured steady state: ~391 MiB RSS and near-zero CPU at rest.
    # Proven necessary 2026-09-05, when a request loop pegged this container at
    # 99.31% for 13 minutes and the process could not even write a log line.
    cpus: 0.85
    mem_limit: 1g
    pids_limit: 256
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
  cron:
    image: ghcr.io/justinduverge-design/omen-cron:main
    container_name: omen_cron
    env_file:
      # Relative to this compose file: deploy/hostinger/.env.production.
      - .env.production
    environment:
      NODE_ENV: production
      TZ: America/New_York
    restart: unless-stopped
    # Same one-core reasoning as the api service. A runaway cron job must not be
    # able to take the public site down with it.
    cpus: 0.5
    mem_limit: 512m
    pids_limit: 128
    # No ports: this is a scheduled worker, not an HTTP service.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
networks:
  default:
    name: omen_network
