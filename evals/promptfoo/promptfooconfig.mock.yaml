description: Slops Saloon LLM prompt regression suite (mock fallback)
providers:
  - id: echo

prompts:
  - prompts/trade.txt
  - prompts/startSit.txt
  - prompts/mvpMove_stub.txt

tests:
  - vars:
      playerGive: "Austin Ekeler (RB, LAC)"
      playerReceive: "Davante Adams (WR, LV)"
      vorpDelta: "+2.3"
      winProbDelta: "+4.1%"
      verdict: "LEAN ACCEPT"
    providerOutput: "lean accept. The +2.3 VORP delta and +4.1% win probability gain make this trade worth taking because the receiving side adds more weekly lineup value. Davante Adams gives you a stronger ceiling than Austin Ekeler in this sample."
    assert:
      - type: contains
        value: "lean accept"
      - type: not-contains
        value: "I cannot"
      - type: javascript
        value: "output.split(' ').length > 20"

  - vars:
      playerA: "Tyreek Hill (WR, MIA)"
      playerB: "Keenan Allen (WR, CHI)"
      projectedDelta: "+3.2"
      recommendation: "START Hill"
    providerOutput: "Start Hill. Hill has the +3.2 point projected advantage and should be prioritized because that edge is meaningful in a close start/sit call."
    assert:
      - type: contains
        value: "Hill"
      - type: not-contains
        value: "I cannot"
