# Vector receiver (Phase 4, shadow). Pinned by digest; host networking, nothing published (fleet rule 4).
services:
  vector:
    image: timberio/vector:0.59.0-debian@sha256:98e7b4dfe50750e61470697bbd2fbeca643d12bea97f351005038ef506eab630
    container_name: omen-vector-receiver
    restart: unless-stopped
    command: ["--config", "/etc/vector/vector.yaml"]
    network_mode: host
    read_only: true
    security_opt: ["no-new-privileges:true"]
    mem_limit: 256m
    cpus: "1.0"
    tmpfs: [/tmp]
    environment:
      VECTOR_HOST: ${VECTOR_HOST:-unknown}
    volumes:
      - /opt/omen-vector/receiver.yaml:/etc/vector/vector.yaml:ro
      - /opt/omen-vector/state:/var/lib/vector
      - /opt/omen-vector/logs:/var/lib/vector-logs
