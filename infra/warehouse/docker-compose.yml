services:
  postgres:
    image: postgres:17.11-bookworm@sha256:91eb910c44c7ed13f7f1a4ccadaa9ca72ef14cddc04cacb6e070e48eb44731a3
    container_name: omen_football_warehouse
    restart: unless-stopped
    environment:
      POSTGRES_DB: omen_football
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/warehouse_postgres_password
    secrets:
      - warehouse_postgres_password
    volumes:
      - warehouse_data:/var/lib/postgresql/data
      - ../../warehouse/migrations/0001_football_warehouse.sql:/opt/omen-warehouse/migrations/0001_football_warehouse.sql:ro
      - ../../warehouse/migrations/0002_record_migration.sh:/docker-entrypoint-initdb.d/0001_apply_warehouse.sh:ro
      - ../../warehouse/migrations/0003_warehouse_access_policy.sql:/opt/omen-warehouse/migrations/0003_warehouse_access_policy.sql:ro
      - ../../warehouse/migrations/0004_apply_access_policy.sh:/docker-entrypoint-initdb.d/0002_apply_access_policy.sh:ro
    networks:
      - warehouse_net
      - omen_network
    mem_limit: 2g
    cpus: 1.25
    pids_limit: 200
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d omen_football >/dev/null && test \"$(psql -U postgres -d omen_football -Atqc \"select count(*) from football.warehouse_schema_migrations where (version=1 and name='0001_football_warehouse' and checksum='27fb1e8dd4a5167ffc27660f165f326e7c9a6e3b4aaf2e04ec16ec4e55448f1c') or (version=2 and name='0003_warehouse_access_policy' and checksum='0b0577edd8995fad967409a37012390d77447cf55595fd4a310270b56f7a169d')\")\" = 2"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  ingest:
    image: ${WAREHOUSE_INGEST_IMAGE:?WAREHOUSE_INGEST_IMAGE must be the release-approved digest reference}
    restart: "no"
    profiles: ["ingest"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      FOOTBALL_WAREHOUSE_DATABASE_URL_FILE: /run/secrets/warehouse_ingest_url
      FOOTBALL_WAREHOUSE_INGEST_ENABLED: "true"
      # After each season ingest: fill the opportunity table and recompute RAT-QB v0 (derivedStages.js).
      FOOTBALL_WAREHOUSE_DERIVED_ENABLED: "true"
      FOOTBALL_WAREHOUSE_SSL_MODE: disable
      FOOTBALL_WAREHOUSE_EXPECTED_DATABASE: omen_football
      FOOTBALL_WAREHOUSE_EXPECTED_ROLE: omen_warehouse_ingest
    secrets:
      - warehouse_ingest_url
    networks:
      - warehouse_net
      - omen_network
    user: "10001:10001"
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 1536m
    cpus: 1.0
    pids_limit: 128
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

volumes:
  warehouse_data:

networks:
  warehouse_net:
    name: omen_warehouse_net
    driver: bridge
    internal: true
  omen_network:
    external: true

secrets:
  warehouse_postgres_password:
    file: /var/lib/omen/secrets/warehouse-postgres-password
  warehouse_ingest_url:
    file: /var/lib/omen/secrets/warehouse-ingest-url
