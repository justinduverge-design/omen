services:
  postgres:
    image: postgres:17.11-bookworm@sha256:91eb910c44c7ed13f7f1a4ccadaa9ca72ef14cddc04cacb6e070e48eb44731a3
    container_name: omen_football_warehouse
    restart: unless-stopped
    environment:
      POSTGRES_DB: omen_football
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/warehouse_postgres_password
    secrets:
      - warehouse_postgres_password
    volumes:
      - warehouse_data:/var/lib/postgresql/data
      - ../../warehouse/migrations/0001_football_warehouse.sql:/opt/omen-warehouse/migrations/0001_football_warehouse.sql:ro
      - ../../warehouse/migrations/0002_record_migration.sh:/docker-entrypoint-initdb.d/0001_apply_warehouse.sh:ro
    networks:
      - warehouse_net
      - omen_network
    mem_limit: 2g
    cpus: 1.25
    pids_limit: 200
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d omen_football >/dev/null && test \"$(psql -U postgres -d omen_football -Atqc \"select count(*) from football.warehouse_schema_migrations where version=1 and name='0001_football_warehouse' and checksum='27fb1e8dd4a5167ffc27660f165f326e7c9a6e3b4aaf2e04ec16ec4e55448f1c'\")\" = 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  warehouse_data:

networks:
  warehouse_net:
    driver: bridge
    internal: true
  omen_network:
    external: true

secrets:
  warehouse_postgres_password:
    file: /var/lib/omen/secrets/warehouse-postgres-password
