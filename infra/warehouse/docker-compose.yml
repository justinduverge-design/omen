services:
  postgres:
    image: postgres:17
    container_name: omen_football_warehouse
    restart: unless-stopped
    environment:
      POSTGRES_DB: football_warehouse
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/warehouse_postgres_password
    secrets:
      - warehouse_postgres_password
    volumes:
      - warehouse_data:/var/lib/postgresql/data
      - ../../warehouse/migrations:/docker-entrypoint-initdb.d:ro
    networks:
      - warehouse_net
      - omen_network
    mem_limit: 2g
    cpus: 1.25
    pids_limit: 200
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d football_warehouse"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  warehouse_data:

networks:
  warehouse_net:
    driver: bridge
    internal: true
  omen_network:
    external: true

secrets:
  warehouse_postgres_password:
    file: /var/lib/omen/secrets/warehouse-postgres-password
