# Hardware watchdog for every Pi (B13-HEAL-WATCHDOG). Deployed to /etc/systemd/system.conf.d/10-slops-watchdog.conf.
# systemd pets the Broadcom watchdog; if the kernel or PID 1 hangs for 15 s, the chip resets the Pi. 15 s is the
# bcm2835 watchdog's ceiling, so a longer value would be clamped. RebootWatchdogSec bounds a reboot that hangs on the
# way down (the 2026-10-29 Command Center case went dark until the power was cut).
[Manager]
RuntimeWatchdogSec=15s
RebootWatchdogSec=2min
