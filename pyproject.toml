# Python tooling only (Phase 1 of the Rust infrastructure plan). Omen's Python is stdlib-only and runs
# on the hosts' system python3, so this project has no runtime dependencies: uv manages dev tools.
[project]
name = "omen-python-tooling"
version = "0"
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = ["ruff==0.17.1"]

[tool.uv]
package = false

[tool.ruff]
target-version = "py311"
line-length = 120
include = ["infra/warehouse/**/*.py", "warehouse/test/**/*.py", "ops/**/*.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
