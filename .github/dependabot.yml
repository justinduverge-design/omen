# Dependabot configuration.
#
# LABELS: the `labels:` keys were removed on 2026-08-11. They referenced
# `dependencies`, `security`, and `android`, none of which exist in this
# repository — GitHub rejected them on every PR with "The following labels
# could not be found." Create those labels first if you want them back.
#
# IGNORES: major-version bumps that require migration work are ignored below
# rather than reopened weekly and closed unread. Each carries the reason and
# the task that would unblock it. Closing a Dependabot PR is not a decision —
# it reopens on the next weekly run. An `ignore` rule is the decision.
#
# Triage policy and the required per-PR receipt live in `Direction/current_sprint.md` → S8.

version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/New_York
    open-pull-requests-limit: 5
    groups:
      production-dependencies:
        dependency-type: production
      development-tooling:
        dependency-type: development

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/New_York
    open-pull-requests-limit: 3

  - package-ecosystem: npm
    directory: "/frontend"
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/New_York
    open-pull-requests-limit: 5
    groups:
      frontend-runtime:
        dependency-type: production
      frontend-tooling:
        dependency-type: development
    ignore:
      # Tailwind v4 is a rewrite, not an upgrade. It removes the JS config
      # format (`frontend/tailwind.config.js` exists) and replaces the
      # `@tailwind` directives (`frontend/src/index.css` has three) with
      # `@import "tailwindcss"`. Merging it breaks the build. Revisit only as
      # a dedicated migration task.
      - dependency-name: "tailwindcss"
        update-types: ["version-update:semver-major"]
      # Vite 8 shipped in the same group as the Tailwind v4 bump and carries
      # its own breaking changes. Minor and patch updates still flow.
      - dependency-name: "vite"
        update-types: ["version-update:semver-major"]
      # Pinned to the Vite major above — upgrading this alone would desync the
      # plugin from the bundler it targets.
      - dependency-name: "@vitejs/plugin-react"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: gradle
    directory: "/mobile/android"
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/New_York
    open-pull-requests-limit: 3
    groups:
      android-dependencies:
        patterns:
          - "*"
