# Dependabot configuration.
#
# LABELS: the `labels:` keys were removed on 2026-08-11. They referenced
# `dependencies`, `security`, and `android`, none of which exist in this
# repository — GitHub rejected them on every PR with "The following labels
# could not be found." Create those labels first if you want them back.
#
# IGNORES: major-version bumps that require migration work are ignored below
# rather than reopened weekly and closed unread. Each carries the reason and
# the task that would unblock it. Closing a Dependabot PR is not a decision —
# it reopens on the next weekly run. An `ignore` rule is the decision.
#
# Triage policy and the required per-PR receipt live in `Direction/current_sprint.md` → S8.

version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/New_York
    open-pull-requests-limit: 5
    groups:
      production-dependencies:
        dependency-type: production
      development-tooling:
        dependency-type: development

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/New_York
    open-pull-requests-limit: 3

  - package-ecosystem: npm
    directory: "/frontend"
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/New_York
    open-pull-requests-limit: 5
    groups:
      frontend-runtime:
        dependency-type: production
      frontend-tooling:
        dependency-type: development
    ignore:
      # Majors of the CSS engine and bundler are migration tasks, not weekly
      # bumps (Tailwind 3 -> 4 and Vite 7 -> 8 landed in #725). Minor and patch
      # updates still flow. tailwindcss and @tailwindcss/vite move together;
      # @vitejs/plugin-react follows the Vite major.
      - dependency-name: "tailwindcss"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@tailwindcss/vite"
        update-types: ["version-update:semver-major"]
      - dependency-name: "vite"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@vitejs/plugin-react"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: gradle
    directory: "/mobile/android"
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/New_York
    open-pull-requests-limit: 3
    groups:
      android-dependencies:
        patterns:
          - "*"
