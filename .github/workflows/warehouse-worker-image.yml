name: Warehouse ingest worker image

on:
  push:
    branches:
      - main
    paths:
      - Dockerfile.warehouse-ingest
      - package.json
      - package-lock.json
      - src/**
      - .github/workflows/warehouse-worker-image.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: warehouse-worker-${{ github.sha }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Require an exact checked-out commit
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          test -z "$(git status --porcelain)"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and push exact-commit worker
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./Dockerfile.warehouse-ingest
          target: production
          platforms: linux/amd64
          push: true
          tags: ghcr.io/justinduverge-design/omen-warehouse-ingest:sha-${{ github.sha }}
          provenance: mode=max
          sbom: true
          build-args: |
            GIT_SHA=${{ github.sha }}
            BUILD_ID=${{ github.run_id }}

      - name: Emit immutable deployment reference
        shell: bash
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          [[ "$IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          image="ghcr.io/justinduverge-design/omen-warehouse-ingest@${IMAGE_DIGEST}"
          printf 'commit=%s\nimage=%s\n' "$GITHUB_SHA" "$image" > warehouse-worker-image.txt

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: warehouse-worker-${{ github.sha }}
          path: warehouse-worker-image.txt
          if-no-files-found: error
          retention-days: 30
