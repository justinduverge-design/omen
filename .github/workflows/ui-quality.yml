name: UI Quality Gate
on:
  pull_request:
    paths:
      - 'frontend/src/**'
jobs:
  ui-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - run: npm ci
      - name: Run impeccable design quality scan
        run: npx impeccable detect frontend/src/
