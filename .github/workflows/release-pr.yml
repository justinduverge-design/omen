name: Release PR

# Keeps one "Release to production" PR open from main into production. Merging to main deploys
# nothing; Justin merging this PR does (deploy.yml runs on pushes to production). The PR is opened
# with the workflow token, so no checks run on it: every commit in it already passed CI on main.
# Needs Settings > Actions > General > "Allow GitHub Actions to create and approve pull requests".
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: release-pr
  cancel-in-progress: true

jobs:
  release-pr:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Open or update the release PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release-pr.mjs
