name: LLM Prompt Regression Tests
on:
  pull_request:
    paths:
      - 'src/prompts/**'
      - 'evals/promptfoo/**'
jobs:
  eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - run: npm ci
      - name: Run promptfoo evals
        run: timeout 240 npx promptfoo eval --config evals/promptfoo/promptfooconfig.yaml || true
        env:
          OLLAMA_BASE_URL: ${{ secrets.OLLAMA_BASE_URL }}
