name: LLM Prompt Regression Tests
on:
  pull_request:
    paths:
      - 'src/prompts/**'
      - 'evals/promptfoo/**'
jobs:
  eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      - name: Run promptfoo evals
        run: npx promptfoo eval --config evals/promptfoo/promptfooconfig.yaml
        env:
          OLLAMA_BASE_URL: ${{ secrets.OLLAMA_BASE_URL }}
