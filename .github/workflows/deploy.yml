# =================================================================
# Slops Saloon - Auto-deploy to Oracle on push to main
# -----------------------------------------------------------------
# Required GitHub secrets (Settings -> Secrets and variables -> Actions):
#   ORACLE_HOST     -  143.47.101.241
#   ORACLE_USER     -  ubuntu
#   ORACLE_SSH_KEY  -  full contents of oraclepr.key (-----BEGIN ... END-----)
#   INFISICAL_TOKEN  -  Infisical service token (oracle-vps-deploy, production read)
#   VITE_SUPABASE_URL       - public Vite build-time Supabase URL
#   VITE_SUPABASE_ANON_KEY  - public Vite build-time Supabase anon key
#   VITE_API_BASE_URL       - optional Vite API base URL override; blank uses same-origin /api
#
# Flow:
#   1. Build API and cron images on GitHub Actions
#   2. Push images to GHCR
#   3. SSH to Oracle, git pull, validate Infisical env, pull images
#   4. Recreate containers with --no-build
#   5. Wait + smoke-test /api/health
#   6. Fail the workflow if health check fails so you get a red X on GitHub
#
# SY0-701 4.7 / 4.8: change-management with audit trail (git history +
# Actions run logs) and rollback (revert commit -> auto-redeploy old).
# =================================================================

name: Deploy to Oracle

on:
  push:
    branches: [main]
  workflow_dispatch:   # manual trigger from the Actions tab

# Don't run two deploys at once - serialize on main.
concurrency:
  group: deploy-oracle
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          target: production
          push: true
          tags: ghcr.io/justinduverge-design/corvus:main
          cache-from: type=gha,scope=corvus-api
          cache-to: type=gha,mode=max,scope=corvus-api
          build-args: |
            VITE_SUPABASE_URL=${{ secrets.VITE_SUPABASE_URL }}
            VITE_SUPABASE_ANON_KEY=${{ secrets.VITE_SUPABASE_ANON_KEY }}
            VITE_API_BASE_URL=${{ secrets.VITE_API_BASE_URL }}
            VITE_ESPN_ENABLED=${{ secrets.VITE_ESPN_ENABLED }}

      - name: Build and push cron image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.cron
          target: production
          push: true
          tags: ghcr.io/justinduverge-design/corvus-cron:main
          cache-from: type=gha,scope=corvus-cron
          cache-to: type=gha,mode=max,scope=corvus-cron

  deploy:
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read

    steps:
      - name: Trust the Oracle host key
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H "${{ secrets.ORACLE_HOST }}" >> ~/.ssh/known_hosts || true

      - name: Write deploy key
        env:
          SSH_KEY: ${{ secrets.ORACLE_SSH_KEY }}
        run: |
          printf '%s\n' "$SSH_KEY" > /tmp/oracle_key
          chmod 600 /tmp/oracle_key

      - name: Verify deploy key fingerprint
        run: ssh-keygen -l -f /tmp/oracle_key

      - name: Pull images and restart on Oracle
        env:
          INFISICAL_TOKEN: ${{ secrets.INFISICAL_TOKEN }}
          GHCR_TOKEN: ${{ github.token }}
          GHCR_USER: ${{ github.actor }}
        run: |
          ssh -i /tmp/oracle_key \
              -o IdentitiesOnly=yes \
              -o StrictHostKeyChecking=accept-new \
              -o BatchMode=yes \
              -o ServerAliveInterval=30 \
              -o ServerAliveCountMax=20 \
              ubuntu@${{ secrets.ORACLE_HOST }} \
              "cd ~/SlopsSaloon-Fantasy-Football-MVP && \
               git pull && \
               printf '%s' '$GHCR_TOKEN' | docker login ghcr.io -u '$GHCR_USER' --password-stdin && \
               INFISICAL_TOKEN=$INFISICAL_TOKEN infisical run --projectId=4498715c-4213-41b1-acf4-278c1451e1fe --env=prod -- bash -lc '
                 set -euo pipefail
                 echo \"==> Checking required production environment\"
                 docker compose config --quiet
                 echo \"==> Pulling GHCR images from GitHub Actions build\"
                 docker compose pull api cron
                 echo \"==> Recreating API and cron with verified environment and no VPS build\"
                 docker compose up -d --no-build api cron
               ' && \
               docker image prune -f"

      - name: Smoke test /api/health (retries up to 60s)
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
        run: |
          for i in $(seq 1 12); do
            if curl -fsS --max-time 4 "https://slopssaloon.com/api/health" > /tmp/health.json 2>/dev/null; then
              echo "Health response:"
              cat /tmp/health.json
              echo ""
              echo "Deploy succeeded on attempt $i"
              exit 0
            fi
            echo "Attempt $i: health endpoint not ready yet, retrying in 5s..."
            sleep 5
          done
          echo "::error::Health check failed after 60s. Check Oracle logs."
          exit 1

      - name: Tail recent server logs (on success or failure)
        if: always()
        env:
          ORACLE_USER: ${{ secrets.ORACLE_USER }}
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
        run: |
          ssh -i /tmp/oracle_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=no -o BatchMode=yes \
              "$ORACLE_USER@$ORACLE_HOST" \
              'docker ps --format "table {{.Names}}\t{{.Status}}" && docker logs corvus_api 2>&1 | tail -25' || true

      - name: Clean up deploy key
        if: always()
        run: rm -f /tmp/oracle_key
