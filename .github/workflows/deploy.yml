# =================================================================
# Slops Saloon - Auto-deploy to Hostinger KVM1 on push to main
# -----------------------------------------------------------------
# Required GitHub secrets (Settings -> Secrets and variables -> Actions):
#   VITE_SUPABASE_URL       - public Vite build-time Supabase URL
#   VITE_SUPABASE_ANON_KEY  - public Vite build-time Supabase anon key
#   VITE_API_BASE_URL       - optional Vite API base URL override; blank uses same-origin /api
#   VITE_ESPN_ENABLED       - build-time flag that shows the ESPN connection UI
#
# Runtime env on KVM1 lives in /opt/omen/deploy/hostinger/.env.production,
# loaded by the compose file's env_file directive. This workflow does NOT
# touch that file — it stays on the VPS, off git, and is managed by hand.
#
# Flow:
#   1. Run backend tests, audit, and frontend build checks
#   2. Build API and cron images on GitHub Actions
#   3. Push images to GHCR
#   4. Run the deploy job on KVM1's self-hosted runner
#   5. Pull images locally on KVM1 and restart containers via compose
#   6. Smoke-test /api/health via the public hostname
#   7. Verify the deployed SPA bundle and public logo routes
#   8. Fail the workflow if health/logo smoke fails so you get a red X on GitHub
#
# SY0-701 4.7 / 4.8: change-management with audit trail (git history +
# Actions run logs) and rollback (revert commit -> auto-redeploy old).
# =================================================================

name: Deploy to Hostinger KVM1

on:
  push:
    branches: [main]
    paths-ignore:
      # Doctrine/docs/CI-config-only pushes should not rebuild images or restart KVM1.
      - ".github/workflows/**"
      - "**/*.md"
      - "Blueprints/**"
      - "Direction/**"
      - "References/**"
  workflow_dispatch:   # manual trigger from the Actions tab

# Don't run two deploys at once - serialize on main.
concurrency:
  group: deploy-kvm1
  cancel-in-progress: false

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - name: Install backend dependencies
        run: npm ci

      - name: Run backend tests
        run: npm test

      - name: Run dependency audit
        run: npm audit --audit-level=moderate --omit=dev

      - name: Build primary frontend
        run: |
          npm --prefix frontend ci
          npm --prefix frontend run build

      - name: Build legacy client bundle
        run: |
          npm --prefix client ci
          npm --prefix client run build

  build:
    runs-on: ubuntu-latest
    needs: quality
    timeout-minutes: 40
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and push API image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          target: production
          push: true
          tags: |
            ghcr.io/justinduverge-design/omen:main
            ghcr.io/justinduverge-design/omen:sha-${{ github.sha }}
          cache-from: type=gha,scope=omen-api
          cache-to: type=gha,mode=max,scope=omen-api
          build-args: |
            VITE_SUPABASE_URL=${{ secrets.VITE_SUPABASE_URL }}
            VITE_SUPABASE_ANON_KEY=${{ secrets.VITE_SUPABASE_ANON_KEY }}
            VITE_API_BASE_URL=${{ secrets.VITE_API_BASE_URL }}
            VITE_ESPN_ENABLED=${{ secrets.VITE_ESPN_ENABLED }}
            GIT_SHA=${{ github.sha }}
            BUILD_ID=${{ github.run_id }}
            IMAGE_TAG=sha-${{ github.sha }}

      - name: Build and push cron image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile.cron
          target: production
          push: true
          tags: |
            ghcr.io/justinduverge-design/omen-cron:main
            ghcr.io/justinduverge-design/omen-cron:sha-${{ github.sha }}
          cache-from: type=gha,scope=omen-cron
          cache-to: type=gha,mode=max,scope=omen-cron
          build-args: |
            GIT_SHA=${{ github.sha }}
            BUILD_ID=${{ github.run_id }}
            IMAGE_TAG=sha-${{ github.sha }}

  deploy:
    runs-on: [self-hosted, kvm1, omen-deploy]
    needs: build
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read

    steps:
      - name: Log in to GHCR from KVM1
        env:
          GHCR_TOKEN: ${{ github.token }}
          GHCR_USER: ${{ github.actor }}
        run: |
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin

      - name: Pull images and restart on KVM1
        run: |
          set -euo pipefail
          cd /opt/omen/deploy/hostinger
          echo '==> Pulling GHCR images built by this workflow'
          docker compose -f docker-compose.prod.yml --project-name omen pull api cron
          echo '==> Recreating API and cron containers (env_file: .env.production stays on KVM1)'
          # The deploy user may pull through the Docker group, but Compose must run
          # as root when it opens the intentionally root-owned 0600 production env.
          sudo docker compose -f docker-compose.prod.yml --project-name omen up -d --no-build api cron
          echo '==> Cleaning up dangling images older than 7 days'
          # Time-scoped on purpose (O2). A bare `docker image prune -f` removed the image
          # this deploy had just replaced — deleting the only local artifact a rollback
          # could have used, moments after creating the need for one. 168h keeps a week of
          # previous builds on disk as a fallback while still bounding growth.
          docker image prune -f --filter "until=168h"


      - name: Smoke test /api/health (retries up to 60s)
        run: |
          for i in $(seq 1 12); do
            if curl -fsS --max-time 4 "https://slopssaloon.com/api/health" > /tmp/health.json 2>/dev/null; then
              echo "Health response:"
              cat /tmp/health.json
              echo ""
              echo "Deploy succeeded on attempt $i"
              exit 0
            fi
            echo "Attempt $i: health endpoint not ready yet, retrying in 5s..."
            sleep 5
          done
          echo "::error::Health check failed after 60s. Check KVM1 logs."
          exit 1

      - name: Verify deployed Omen logo asset in SPA bundle
        run: |
          set -euo pipefail
          base_url="https://slopssaloon.com"

          curl -fsS --max-time 8 "$base_url/" -o /tmp/omen-index.html
          bundle_src="$(grep -oE 'src="/assets/[^"]+\.js"' /tmp/omen-index.html | head -1 | sed -E 's/^src="//; s/"$//' || true)"

          if [ -z "$bundle_src" ]; then
            echo "::error::Could not find the production Vite bundle in the deployed HTML."
            exit 1
          fi

          curl -fsS --max-time 8 "$base_url$bundle_src" -o /tmp/omen-bundle.js
          if ! grep -q "omen-horizontal-lockup-transparent.png" /tmp/omen-bundle.js; then
            echo "::error::Production bundle is missing the Omen horizontal lockup reference."
            exit 1
          fi

          curl -fsSI --max-time 8 "$base_url/omen-horizontal-lockup-transparent.png" >/tmp/omen-logo-head.txt
          echo "Verified Omen lockup reference in $bundle_src and asset availability."

      - name: slops-canary public-route visual smoke
        run: |
          set -euo pipefail
          base_url="https://slopssaloon.com"
          routes=("/" "/about" "/login")
          bundle_src=""
          bundle_path="/tmp/omen-visual-smoke-bundle.js"

          for route in "${routes[@]}"; do
            route_label="${route//\//_}"
            if [ "$route_label" = "_" ]; then
              route_label="root"
            fi

            html_path="/tmp/omen-visual-smoke-${route_label}.html"
            curl -fsS --max-time 8 "$base_url$route" -o "$html_path"

            if grep -Fq "[C]" "$html_path"; then
              echo "::error::Route $route contains the retired [C] placeholder in the HTML shell."
              exit 1
            fi

            route_bundle="$(grep -oE 'src="/assets/[^"]+\.js"' "$html_path" | head -1 | sed -E 's/^src="//; s/"$//' || true)"
            if [ -z "$route_bundle" ]; then
              echo "::error::Route $route did not expose a Vite bundle source."
              exit 1
            fi

            if [ "$route_bundle" != "$bundle_src" ]; then
              bundle_src="$route_bundle"
              curl -fsS --max-time 8 "$base_url$bundle_src" -o "$bundle_path"
            fi

            # A bare [C] also occurs in minified JavaScript property access
            # (for example, `object[C]`). The retired React placeholder is a
            # string literal, so require its quoted representation instead.
            if grep -Fq '"[C]"' "$bundle_path"; then
              echo "::error::Route $route bundle contains the retired [C] placeholder."
              exit 1
            fi

            if ! grep -Eq "omen-horizontal-lockup[^\\\"]*\\.png" "$bundle_path"; then
              echo "::error::Route $route bundle does not reference an Omen horizontal lockup PNG."
              exit 1
            fi

            if ! grep -Fq "omen-horizontal-lockup-transparent.png" "$bundle_path"; then
              echo "::error::Route $route bundle is missing the transparent Omen lockup reference."
              exit 1
            fi

            if grep -Fq "omen-horizontal-lockup.png" "$bundle_path"; then
              echo "::error::Route $route bundle still references the baked-black lockup fallback."
              exit 1
            fi

            echo "Public logo smoke passed for $route via $bundle_src"
          done

      - name: Tail recent server logs (on success or failure)
        if: always()
        run: |
          docker ps --format "table {{.Names}}\t{{.Status}}"
          docker logs omen_api 2>&1 | tail -25 || true

      - name: Log out of GHCR
        if: always()
        run: docker logout ghcr.io || true
