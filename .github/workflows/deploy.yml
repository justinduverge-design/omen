# =================================================================
# Slops Saloon - Auto-deploy to Hostinger KVM1 on push to main
# -----------------------------------------------------------------
# Required GitHub secrets (Settings -> Secrets and variables -> Actions):
#   KVM1_HOST       -  KVM1 public IP (e.g. 2.25.182.1)
#   KVM1_USER       -  SSH user on KVM1 (e.g. justin)
#   KVM1_SSH_KEY    -  Full contents of the deploy private key
#                      (-----BEGIN OPENSSH PRIVATE KEY----- ... END-----)
#   VITE_SUPABASE_URL       - public Vite build-time Supabase URL
#   VITE_SUPABASE_ANON_KEY  - public Vite build-time Supabase anon key
#   VITE_API_BASE_URL       - optional Vite API base URL override; blank uses same-origin /api
#   VITE_ESPN_ENABLED       - build-time flag that shows the ESPN connection UI
#
# Runtime env on KVM1 lives in /opt/corvus/deploy/hostinger/.env.production,
# loaded by the compose file's env_file directive. This workflow does NOT
# touch that file — it stays on the VPS, off git, and is managed by hand.
#
# Flow:
#   1. Run backend tests, audit, and frontend build checks
#   2. Build API and cron images on GitHub Actions
#   3. Push images to GHCR
#   4. SSH to KVM1, pull images, restart containers via compose
#   5. Smoke-test /api/health via the public hostname
#   6. Fail the workflow if health check fails so you get a red X on GitHub
#
# SY0-701 4.7 / 4.8: change-management with audit trail (git history +
# Actions run logs) and rollback (revert commit -> auto-redeploy old).
# =================================================================

name: Deploy to Hostinger KVM1

on:
  push:
    branches: [main]
  workflow_dispatch:   # manual trigger from the Actions tab

# Don't run two deploys at once - serialize on main.
concurrency:
  group: deploy-kvm1
  cancel-in-progress: false

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm

      - name: Install backend dependencies
        run: npm ci

      - name: Run backend tests
        run: npm test

      - name: Run dependency audit
        run: npm audit --audit-level=moderate --omit=dev

      - name: Build primary frontend
        run: |
          npm --prefix frontend ci
          npm --prefix frontend run build

      - name: Build legacy client bundle
        run: |
          npm --prefix client ci
          npm --prefix client run build

  build:
    runs-on: ubuntu-latest
    needs: quality
    timeout-minutes: 40
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and push API image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          target: production
          push: true
          tags: ghcr.io/justinduverge-design/corvus:main
          cache-from: type=gha,scope=corvus-api
          cache-to: type=gha,mode=max,scope=corvus-api
          build-args: |
            VITE_SUPABASE_URL=${{ secrets.VITE_SUPABASE_URL }}
            VITE_SUPABASE_ANON_KEY=${{ secrets.VITE_SUPABASE_ANON_KEY }}
            VITE_API_BASE_URL=${{ secrets.VITE_API_BASE_URL }}
            VITE_ESPN_ENABLED=${{ secrets.VITE_ESPN_ENABLED }}

      - name: Build and push cron image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile.cron
          target: production
          push: true
          tags: ghcr.io/justinduverge-design/corvus-cron:main
          cache-from: type=gha,scope=corvus-cron
          cache-to: type=gha,mode=max,scope=corvus-cron

  deploy:
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read

    steps:
      - name: Trust the KVM1 host key
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H "${{ secrets.KVM1_HOST }}" >> ~/.ssh/known_hosts || true

      - name: Write deploy key
        env:
          SSH_KEY: ${{ secrets.KVM1_SSH_KEY }}
        run: |
          printf '%s\n' "$SSH_KEY" > /tmp/kvm1_key
          chmod 600 /tmp/kvm1_key

      - name: Verify deploy key fingerprint
        run: ssh-keygen -l -f /tmp/kvm1_key

      - name: Pull images and restart on KVM1
        env:
          GHCR_TOKEN: ${{ github.token }}
          GHCR_USER: ${{ github.actor }}
        run: |
          ssh -i /tmp/kvm1_key \
              -o IdentitiesOnly=yes \
              -o StrictHostKeyChecking=accept-new \
              -o BatchMode=yes \
              -o ServerAliveInterval=30 \
              -o ServerAliveCountMax=20 \
              ${{ secrets.KVM1_USER }}@${{ secrets.KVM1_HOST }} \
              "set -euo pipefail && \
               cd /opt/corvus/deploy/hostinger && \
               printf '%s' '$GHCR_TOKEN' | docker login ghcr.io -u '$GHCR_USER' --password-stdin && \
               echo '==> Pulling GHCR images built by this workflow' && \
               docker compose -f docker-compose.prod.yml --project-name corvus pull api cron && \
               echo '==> Recreating API and cron containers (env_file: .env.production stays on KVM1)' && \
               docker compose -f docker-compose.prod.yml --project-name corvus up -d --no-build api cron && \
               echo '==> Cleaning up dangling images' && \
               docker image prune -f"

      - name: Smoke test /api/health (retries up to 60s)
        run: |
          for i in $(seq 1 12); do
            if curl -fsS --max-time 4 "https://slopssaloon.com/api/health" > /tmp/health.json 2>/dev/null; then
              echo "Health response:"
              cat /tmp/health.json
              echo ""
              echo "Deploy succeeded on attempt $i"
              exit 0
            fi
            echo "Attempt $i: health endpoint not ready yet, retrying in 5s..."
            sleep 5
          done
          echo "::error::Health check failed after 60s. Check KVM1 logs."
          exit 1

      - name: Tail recent server logs (on success or failure)
        if: always()
        run: |
          ssh -i /tmp/kvm1_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=no -o BatchMode=yes \
              ${{ secrets.KVM1_USER }}@${{ secrets.KVM1_HOST }} \
              'docker ps --format "table {{.Names}}\t{{.Status}}" && docker logs corvus_api 2>&1 | tail -25' || true

      - name: Clean up deploy key
        if: always()
        run: rm -f /tmp/kvm1_key
