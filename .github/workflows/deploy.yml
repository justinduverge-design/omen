# =================================================================
# SSFFMVP - Auto-deploy to Oracle on push to main
# -----------------------------------------------------------------
# Required GitHub secrets (Settings -> Secrets and variables -> Actions):
#   ORACLE_HOST     -  143.47.101.241
#   ORACLE_USER     -  ubuntu
#   ORACLE_SSH_KEY  -  full contents of oraclepr.key (-----BEGIN ... END-----)
#
# Flow:
#   1. SSH agent loads the private key
#   2. ssh-keyscan adds Oracle's host key to known_hosts (no MITM blind spot)
#   3. Run git pull + docker compose build + up on Oracle
#   4. Wait + smoke-test /api/health
#   5. Fail the workflow if health check fails so you get a red X on GitHub
#
# SY0-701 4.7 / 4.8: change-management with audit trail (git history +
# Actions run logs) and rollback (revert commit -> auto-redeploy old).
# =================================================================

name: Deploy to Oracle

on:
  push:
    branches: [main]
  workflow_dispatch:   # manual trigger from the Actions tab

# Don't run two deploys at once - serialize on main.
concurrency:
  group: deploy-oracle
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Load SSH key into agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.ORACLE_SSH_KEY }}

      - name: Trust the Oracle host key
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H "${{ secrets.ORACLE_HOST }}" >> ~/.ssh/known_hosts

      - name: Pull, rebuild, restart on Oracle
        env:
          ORACLE_USER: ${{ secrets.ORACLE_USER }}
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
        run: |
          ssh -o StrictHostKeyChecking=yes "$ORACLE_USER@$ORACLE_HOST" 'bash -se' <<'REMOTE'
          set -euo pipefail
          cd ~/SlopsSaloon-Fantasy-Football-MVP

          echo ":: git pull"
          git pull --ff-only origin main

          echo ":: docker compose build (cached - manually run --no-cache via workflow_dispatch if needed)"
          docker compose build api

          echo ":: docker compose up -d"
          docker compose up -d

          echo ":: prune dangling images"
          docker image prune -f --filter "until=72h" || true

          echo ":: wait for container"
          sleep 15

          echo ":: container status"
          docker compose ps
          REMOTE

      - name: Smoke test /api/health (retries up to 60s)
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
        run: |
          for i in $(seq 1 12); do
            if curl -fsS --max-time 4 "https://slopssaloon.com/api/health" > /tmp/health.json 2>/dev/null; then
              echo "Health response:"
              cat /tmp/health.json
              echo ""
              echo "Deploy succeeded on attempt $i"
              exit 0
            fi
            echo "Attempt $i: health endpoint not ready yet, retrying in 5s..."
            sleep 5
          done
          echo "::error::Health check failed after 60s. Check Oracle logs."
          exit 1

      - name: Tail recent server logs (on success or failure)
        if: always()
        env:
          ORACLE_USER: ${{ secrets.ORACLE_USER }}
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
        run: |
          ssh "$ORACLE_USER@$ORACLE_HOST" 'docker logs ssffmvp_api 2>&1 | tail -25' || true
