# =================================================================
# SSFFMVP - Auto-deploy to Oracle on push to main
# -----------------------------------------------------------------
# Required GitHub secrets (Settings -> Secrets and variables -> Actions):
#   ORACLE_HOST     -  143.47.101.241
#   ORACLE_USER     -  ubuntu
#   ORACLE_SSH_KEY  -  full contents of oraclepr.key (-----BEGIN ... END-----)
#   INFISICAL_TOKEN  -  Infisical service token (oracle-vps-deploy, production read)
#
# Flow:
#   1. SSH agent loads the private key
#   2. ssh-keyscan adds Oracle's host key to known_hosts (no MITM blind spot)
#   3. Run git pull + Infisical env preflight + Docker build on Oracle
#   4. Recreate containers only after config and build succeed
#   5. Wait + smoke-test /api/health
#   6. Fail the workflow if health check fails so you get a red X on GitHub
#
# SY0-701 4.7 / 4.8: change-management with audit trail (git history +
# Actions run logs) and rollback (revert commit -> auto-redeploy old).
# =================================================================

name: Deploy to Oracle

on:
  push:
    branches: [main]
  workflow_dispatch:   # manual trigger from the Actions tab

# Don't run two deploys at once - serialize on main.
concurrency:
  group: deploy-oracle
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Trust the Oracle host key
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H "${{ secrets.ORACLE_HOST }}" >> ~/.ssh/known_hosts || true

      - name: Write deploy key
        env:
          SSH_KEY: ${{ secrets.ORACLE_SSH_KEY }}
        run: |
          printf '%s\n' "$SSH_KEY" > /tmp/oracle_key
          chmod 600 /tmp/oracle_key

      - name: Verify deploy key fingerprint
        run: ssh-keygen -l -f /tmp/oracle_key

      - name: Pull, preflight, rebuild, restart on Oracle
        env:
          INFISICAL_TOKEN: ${{ secrets.INFISICAL_TOKEN }}
        run: |
          ssh -i /tmp/oracle_key \
              -o IdentitiesOnly=yes \
              -o StrictHostKeyChecking=accept-new \
              -o BatchMode=yes \
              -o ServerAliveInterval=30 \
              -o ServerAliveCountMax=20 \
              ubuntu@${{ secrets.ORACLE_HOST }} \
              "cd ~/SlopsSaloon-Fantasy-Football-MVP && \
               git pull && \
               INFISICAL_TOKEN=$INFISICAL_TOKEN infisical run --env=production -- bash -lc '
                 set -euo pipefail
                 echo \"==> Checking required production environment\"
                 docker compose config --quiet
                 echo \"==> Building API image before replacing containers\"
                 docker compose build api
                 echo \"==> Recreating API and cron with verified environment\"
                 docker compose up -d --no-build api cron
               ' && \
               docker image prune -f"

      - name: Smoke test /api/health (retries up to 60s)
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
        run: |
          for i in $(seq 1 12); do
            if curl -fsS --max-time 4 "https://slopssaloon.com/api/health" > /tmp/health.json 2>/dev/null; then
              echo "Health response:"
              cat /tmp/health.json
              echo ""
              echo "Deploy succeeded on attempt $i"
              exit 0
            fi
            echo "Attempt $i: health endpoint not ready yet, retrying in 5s..."
            sleep 5
          done
          echo "::error::Health check failed after 60s. Check Oracle logs."
          exit 1

      - name: Tail recent server logs (on success or failure)
        if: always()
        env:
          ORACLE_USER: ${{ secrets.ORACLE_USER }}
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
        run: |
          ssh -i /tmp/oracle_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=no -o BatchMode=yes \
              "$ORACLE_USER@$ORACLE_HOST" \
              'docker ps --format "table {{.Names}}\t{{.Status}}" && docker logs ssffmvp_api 2>&1 | tail -25' || true

      - name: Clean up deploy key
        if: always()
        run: rm -f /tmp/oracle_key
