# Non-signing iOS simulator CI for the native SwiftUI app (M2-E decision:
# GitHub macOS simulator CI, included/non-billed capacity, no signing).
#
# COST NOTE: macOS runners bill at a higher multiplier on private repos. This
# workflow is deliberately narrow — it runs for relevant pull requests, on
# main after merge, or on manual dispatch — to keep runner-minute usage
# minimal. Do not broaden the triggers without founder approval.
#
# Runs the OmenIOSTests unit-test target (host app OmenIOS) against a concrete
# iOS Simulator destination, signing disabled, per the M3-A iOS auth parity
# spec (GitHub issue #159). Pins an explicit Xcode version rather than relying
# on the runner image's changing default, per that spec's CI requirement.

name: iOS CI

on:
  # Run on main-branch pushes (post-merge sanity) and on PRs targeting main.
  # Feature-branch pushes are covered by the pull_request trigger — running both
  # would double macOS-runner cost per commit. `workflow_dispatch` remains for
  # on-demand reruns.
  push:
    branches: [main]
    branches:
      - main
    paths:
      - "mobile/ios/**"
      - ".github/workflows/ios-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "mobile/ios/**"
      - ".github/workflows/ios-ci.yml"
  workflow_dispatch: {}

concurrency:
  group: ios-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Unit tests (iOS Simulator, no signing)
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # Explicit Xcode selection so the toolchain doesn't silently drift with
      # runner image updates. Bump this version (and re-verify it's available
      # on macos-14) if a future image drops it.
      - name: Select Xcode 16.2
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "16.2"

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version
          xcodebuild -list -project mobile/ios/OmenIOS/OmenIOS.xcodeproj

      - name: Run OmenIOSTests (simulator, unsigned)
        run: |
          xcodebuild test \
            -project mobile/ios/OmenIOS/OmenIOS.xcodeproj \
            -scheme OmenIOS \
            -destination 'platform=iOS Simulator,name=iPhone 16' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO
