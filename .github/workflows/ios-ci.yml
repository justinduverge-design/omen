# Non-signing iOS simulator CI for the native SwiftUI app (M2-E decision:
# GitHub macOS simulator CI, included/non-billed capacity, no signing).
#
# COST NOTE: macOS runners bill at a higher multiplier on private repos. As of
# 2026-08-11 this workflow no longer runs per-PR. Routine iOS verification moved
# to the founder's local Mac (Xcode/simulator) — see
# `Blueprints/definition-of-done.md` → "Local substitutes". CI is now reserved
# for release branches and manual dispatch, where a reproducible, PR-attached
# build actually matters. Do not broaden the triggers without founder approval.
#
# Runs the OmenIOSTests unit-test target (host app OmenIOS) against a concrete
# iOS Simulator destination, signing disabled, per the M3-A iOS auth parity
# spec (GitHub issue #159). Pins an explicit Xcode version rather than relying
# on the runner image's changing default, per that spec's CI requirement.

name: iOS CI

on:
  # Release branches only. Day-to-day iOS verification happens locally on the
  # Mac; burning macOS runner minutes on every PR bought little that a local
  # `xcodebuild test` does not already prove. Release builds still run here so
  # the artifact that ships has reproducible, attached CI evidence.
  push:
    branches:
      - "release/**"
    paths:
      - "mobile/ios/**"
      - ".github/workflows/ios-ci.yml"
  pull_request:
    branches:
      - "release/**"
    paths:
      - "mobile/ios/**"
      - ".github/workflows/ios-ci.yml"
  # On-demand reruns — use this before any store submission.
  workflow_dispatch: {}

concurrency:
  group: ios-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Unit tests (iOS Simulator, no signing)
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      # Explicit Xcode selection so the toolchain doesn't silently drift with
      # runner image updates. Bump this version (and re-verify it's available
      # on macos-14) if a future image drops it.
      - name: Select Xcode 16.2
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "16.2"

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version
          xcodebuild -list -project mobile/ios/OmenIOS/OmenIOS.xcodeproj

      - name: Run OmenIOSTests (simulator, unsigned)
        run: |
          xcodebuild test \
            -project mobile/ios/OmenIOS/OmenIOS.xcodeproj \
            -scheme OmenIOS \
            -destination 'platform=iOS Simulator,name=iPhone 16' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO
