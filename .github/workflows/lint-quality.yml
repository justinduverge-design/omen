name: Lint quality

# Phase 1 tooling (Blueprints/specs/infrastructure/omen-rust-infrastructure-plan-v1.md).
# Report-only (continue-on-error) until each backlog is clean, then make it blocking.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lint-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shellcheck:
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: shellcheck (preinstalled on ubuntu-latest)
        run: git ls-files -z '*.sh' | xargs -0 shellcheck --severity=warning --format=gcc

  typos:
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: crate-ci/typos@7f9d0819ca1c008ade73f4b41fa9d258d48f605b # v1.51.1
        with:
          config: .github/_typos.toml
