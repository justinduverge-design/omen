name: Migration CI

# The node-pg-migrate job (`test-migrations`) was retired 2026-10-01 with the files it ran: production never
# used that framework. Production's own migration history owns the schema; this job rehearses every reviewed
# step against a proven copy of production's schema.

on:
  pull_request:
    paths:
      - 'sql/2026-10-01-redo/**'
      - 'sql/pending/**'
      - 'scripts/db/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/migrations-ci.yml'
  workflow_dispatch:

jobs:
  # The 2026-10-01 database redo (sql/2026-10-01-redo/, design in Blueprints/rebuild/omen-database-redo-v1.md).
  # Plain Postgres 17: the shim reproduces the Supabase pieces the steps rely on, and the job first proves
  # the scratch snapshot equals the production catalog fixture. Then every step goes up, through its
  # tests, down (schema and data must equal the state before), and up again (must be identical).
  redo-rehearsal:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      - name: Rehearse the redo steps (up, test, down, up)
        env:
          PGHOST: localhost
          PGPORT: '5432'
          PGUSER: postgres
          PGPASSWORD: password
        run: |
          psql --version
          scripts/db/rehearse-redo.sh

      - name: Credential and erase races leave no orphaned Vault secret
        env:
          PGHOST: localhost
          PGPORT: '5432'
          PGUSER: postgres
          PGPASSWORD: password
        run: scripts/db/concurrency-check.sh

      # STANDARDS card K: pending SQL is rehearsed on today's production schema before the founder is asked.
      - name: Rehearse sql/pending (applies on today's production, safe to re-run)
        env:
          PGHOST: localhost
          PGPORT: '5432'
          PGUSER: postgres
          PGPASSWORD: password
        run: scripts/db/rehearse-pending.sh
