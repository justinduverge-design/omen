# ════════════════════════════════════════════════════════════════
# Omen — docker-compose.yml
# ════════════════════════════════════════════════════════════════
# Two services:
#   api  — Express server (platform_integration.js) on port 3000
#   cron — Worker that runs omen_tuesday_cron.js on a schedule
#
# Usage:
#   docker-compose up --build          # start both services
#   docker-compose up api              # api only
#   docker-compose logs -f cron        # watch cron output
#   docker-compose down                # stop everything
# ════════════════════════════════════════════════════════════════


services:

  # ── API SERVICE ────────────────────────────────────────────────
  # Runs platform_integration.js — handles OAuth, standings,
  # roster endpoints, and the agent pipeline route.
  api:
    image: ghcr.io/justinduverge-design/omen:main
    build:
      context: .
      dockerfile: Dockerfile
      target: production
      args:
        # Vite inlines these into the SPA bundle at build time. They
        # come from your .env (or environment) - safe to expose since
        # they're public-anon credentials.
        VITE_SUPABASE_URL:      ${VITE_SUPABASE_URL:-}
        VITE_SUPABASE_ANON_KEY: ${VITE_SUPABASE_ANON_KEY:-}
        VITE_API_BASE_URL:      ${VITE_API_BASE_URL:-}
    container_name: omen_api
    command: node src/server.js
    ports:
      # Bind to localhost only - nginx terminates TLS on 80/443
      # and proxies to this. Port 3000 must NOT be reachable from
      # the public internet directly. SY0-701 4.1: defense in depth.
      - "127.0.0.1:3000:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      APP_BASE_URL: ${APP_BASE_URL:?APP_BASE_URL is required}
      SUPABASE_URL: ${SUPABASE_URL:?SUPABASE_URL is required}
      SUPABASE_SERVICE_KEY: ${SUPABASE_SERVICE_KEY:?SUPABASE_SERVICE_KEY is required}
      REDIS_URL: ${REDIS_URL:?REDIS_URL is required}
      REDIS_TOKEN: ${REDIS_TOKEN:?REDIS_TOKEN is required}
      YAHOO_CLIENT_ID: ${YAHOO_CLIENT_ID:?YAHOO_CLIENT_ID is required}
      YAHOO_CLIENT_SECRET: ${YAHOO_CLIENT_SECRET:?YAHOO_CLIENT_SECRET is required}
      YAHOO_REDIRECT_URI: ${YAHOO_REDIRECT_URI:?YAHOO_REDIRECT_URI is required}
      # Gates starting a NEW Yahoo connection. Default false while Yahoo's
      # Fantasy API entitlement is pending. Must match on api and cron.
      YAHOO_ENABLED: ${YAHOO_ENABLED:-false}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      CORS_ORIGINS: ${CORS_ORIGINS}
      LLM_BASE_URL: ${LLM_BASE_URL}
      LLM_MODEL: ${LLM_MODEL}
      LLM_TIMEOUT: ${LLM_TIMEOUT}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ── CRON SERVICE ───────────────────────────────────────────────
  # Stays alive permanently using a lightweight Alpine cron daemon.
  # The actual omen_tuesday_cron.js runs at 6:00 AM EST every Tuesday.
  # Logs are written to /var/log/omen_cron.log inside container.
  cron:
    image: ghcr.io/justinduverge-design/omen-cron:main
    build:
      context: .
      dockerfile: Dockerfile.cron     # separate cron Dockerfile below
      target: production
    container_name: omen_cron
    environment:
      NODE_ENV: production
      TZ: America/New_York            # ensures 6 AM EST is correct
      APP_BASE_URL: ${APP_BASE_URL:?APP_BASE_URL is required}
      SUPABASE_URL: ${SUPABASE_URL:?SUPABASE_URL is required}
      SUPABASE_SERVICE_KEY: ${SUPABASE_SERVICE_KEY:?SUPABASE_SERVICE_KEY is required}
      REDIS_URL: ${REDIS_URL:?REDIS_URL is required}
      REDIS_TOKEN: ${REDIS_TOKEN:?REDIS_TOKEN is required}
      OMEN_CRON_SCORING_ENABLED: ${OMEN_CRON_SCORING_ENABLED:-${CORVUS_CRON_SCORING_ENABLED:-false}}
      SPORTRADAR_API_KEY: ${SPORTRADAR_API_KEY}
      YAHOO_CLIENT_ID: ${YAHOO_CLIENT_ID:?YAHOO_CLIENT_ID is required}
      YAHOO_CLIENT_SECRET: ${YAHOO_CLIENT_SECRET:?YAHOO_CLIENT_SECRET is required}
      YAHOO_REDIRECT_URI: ${YAHOO_REDIRECT_URI:?YAHOO_REDIRECT_URI is required}
      # Gates starting a NEW Yahoo connection. Default false while Yahoo's
      # Fantasy API entitlement is pending. Must match on api and cron.
      YAHOO_ENABLED: ${YAHOO_ENABLED:-false}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      CORS_ORIGINS: ${CORS_ORIGINS}
      LLM_BASE_URL: ${LLM_BASE_URL}
      LLM_MODEL: ${LLM_MODEL}
      LLM_TIMEOUT: ${LLM_TIMEOUT}
    restart: unless-stopped
    # No ports exposed — cron is a pure worker, no HTTP
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

# ── SHARED NETWORK ─────────────────────────────────────────────
# Both services share a private network so they can communicate
# internally if needed (e.g. cron calls api endpoints)
networks:
  default:
    name: omen_network
