<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Email code</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Wix+Madefor+Display:wght@500;700;800&amp;family=Wix+Madefor+Text:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#D8A648}a:hover{color:#F5F0E8}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #1F1F1D; color: #F5F0E8; font-family: 'Wix Madefor Text', system-ui, sans-serif; overflow: hidden; display: flex; flex-direction: column">

  <div aria-hidden="true" style="height: 54px; flex: none; display: flex; justify-content: center; align-items: flex-start; padding-top: 11px; box-sizing: border-box"><span style="width: 124px; height: 36px; border-radius: 18px; background: #000"></span></div>

  <div style="display: flex; align-items: center; padding: 0 8px; min-height: 44px">
    <a href="Welcome.dc.html" aria-label="Back" style="display: inline-flex; align-items: center; gap: 2px; padding: 10px 8px; text-decoration: none; color: #F5F0E8; font-size: 15px; font-weight: 600"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg>Back</a>
  </div>

  <div style="flex: 1; padding: 16px 24px 34px; display: flex; flex-direction: column; gap: 18px">
    <div>
      <h1 style="margin: 0; font-family: 'Wix Madefor Display', sans-serif; font-size: 30px; font-weight: 800; letter-spacing: -.05em; line-height: 1.04">Check your email</h1>
      <p style="margin: 8px 0 0; font-size: 15px; line-height: 1.5; color: #BDB5A9">We sent a 6-digit code to <b style="color: #F5F0E8">[your email]</b>. It works for 10 minutes.</p>
    </div>

    <label style="display: flex; flex-direction: column; gap: 10px">
      <span style="font-size: 10px; font-weight: 800; letter-spacing: .2em; color: #A79E90">CODE</span>
      <span style="display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 8px">
        <span style="height: 58px; border-radius: 12px; background: #2A2A27; display: grid; place-items: center; font-family: 'Wix Madefor Display', sans-serif; font-size: 26px; font-weight: 800">4</span>
        <span style="height: 58px; border-radius: 12px; background: #2A2A27; display: grid; place-items: center; font-family: 'Wix Madefor Display', sans-serif; font-size: 26px; font-weight: 800">8</span>
        <span style="height: 58px; border-radius: 12px; background: #2A2A27; display: grid; place-items: center; font-family: 'Wix Madefor Display', sans-serif; font-size: 26px; font-weight: 800">1</span>
        <span style="height: 58px; border-radius: 12px; background: #2A2A27; box-shadow: inset 0 0 0 2px #C4933B; display: grid; place-items: center"></span>
        <span style="height: 58px; border-radius: 12px; background: #2A2A27"></span>
        <span style="height: 58px; border-radius: 12px; background: #2A2A27"></span>
      </span>
      <input type="text" inputmode="numeric" autocomplete="one-time-code" aria-label="6-digit code" style="position: absolute; opacity: 0; width: 1px; height: 1px">
    </label>
    <p style="margin: -6px 0 0; font-size: 13px; color: #A79E90">The code fills in from Mail or Messages when you tap the field.</p>

    <div style="margin-top: auto; display: flex; flex-direction: column; gap: 6px; align-items: center">
      <button type="button" disabled style="all: unset; font-size: 15px; font-weight: 700; color: #A79E90; padding: 12px 0">Send a new code in 0:42</button>
      <a href="Welcome.dc.html" style="font-size: 14px; font-weight: 700; color: #C4933B; text-decoration: none; padding: 10px 0">Use a different email</a>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>

  renderVals() { return {}; }

</script>
</body>
</html>
