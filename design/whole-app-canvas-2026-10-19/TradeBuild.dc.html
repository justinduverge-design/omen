<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Build a trade</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Wix+Madefor+Display:wght@500;700;800&amp;family=Wix+Madefor+Text:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#D8A648}a:hover{color:#F5F0E8}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #1F1F1D; color: #F5F0E8; font-family: 'Wix Madefor Text', system-ui, sans-serif; overflow: hidden; display: flex; flex-direction: column">

  <div aria-hidden="true" style="height: 54px; flex: none; display: flex; justify-content: center; align-items: flex-start; padding-top: 11px; box-sizing: border-box"><span style="width: 124px; height: 36px; border-radius: 18px; background: #000"></span></div>

  <div style="display: flex; align-items: center; justify-content: space-between; padding: 0 8px; min-height: 44px">
    <a href="TradeMode.dc.html" aria-label="Back to Trade" style="display: inline-flex; align-items: center; gap: 2px; padding: 10px 8px; text-decoration: none; color: #F5F0E8; font-size: 15px; font-weight: 600"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg>Trade</a>
    <a href="#" style="padding: 10px 8px; font-size: 14px; font-weight: 700; color: #C4933B; text-decoration: none">Change partner</a>
  </div>

  <div style="flex: 1; padding: 4px 16px 24px; display: flex; flex-direction: column; gap: 12px">
    <h1 style="margin: 0; font-family: 'Wix Madefor Display', sans-serif; font-size: 24px; font-weight: 800; letter-spacing: -.045em; line-height: 1.08">You and The Commish</h1>

    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
      <div style="border-radius: 14px; background: #2A2A27; padding: 10px; display: flex; flex-direction: column; gap: 6px; min-height: 92px">
        <span style="font-size: 10px; font-weight: 800; letter-spacing: .16em; color: #A79E90">YOU SEND · 1</span>
        <span style="display: inline-flex; align-items: center; justify-content: space-between; padding: 8px 10px; border-radius: 10px; background: #3F3F3B; font-size: 13px; font-weight: 700">Breece Hall <span aria-label="Remove" style="color: #A79E90">✕</span></span>
      </div>
      <div style="border-radius: 14px; background: #2A2A27; padding: 10px; display: flex; flex-direction: column; gap: 6px; min-height: 92px">
        <span style="font-size: 10px; font-weight: 800; letter-spacing: .16em; color: #A79E90">YOU GET · 2</span>
        <span style="display: inline-flex; align-items: center; justify-content: space-between; padding: 8px 10px; border-radius: 10px; background: #3F3F3B; font-size: 13px; font-weight: 700">G. Wilson <span aria-label="Remove" style="color: #A79E90">✕</span></span>
        <span style="display: inline-flex; align-items: center; justify-content: space-between; padding: 8px 10px; border-radius: 10px; background: #3F3F3B; font-size: 13px; font-weight: 700">K. Walker <span aria-label="Remove" style="color: #A79E90">✕</span></span>
      </div>
    </div>

    <div role="tablist" aria-label="Roster" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); padding: 3px; border-radius: 12px; background: #2A2A27">
      <button type="button" role="tab" aria-selected="false" style="all: unset; cursor: pointer; text-align: center; padding: 9px 0; font-size: 13px; font-weight: 700; color: #BDB5A9">Your roster</button>
      <button type="button" role="tab" aria-selected="true" style="all: unset; cursor: pointer; text-align: center; padding: 9px 0; border-radius: 9px; background: #3F3F3B; font-size: 13px; font-weight: 700">The Commish</button>
    </div>

    <div style="border-radius: 13px; background: #2A2A27; padding: 0 12px">
      <label style="display: flex; align-items: center; gap: 12px; min-height: 48px; border-bottom: 1px solid rgba(245,240,232,.05); cursor: pointer"><input type="checkbox" checked style="width: 20px; height: 20px; accent-color: #C4933B; margin: 0"><span style="flex: 1; font-size: 14px">Garrett Wilson <span style="font-size: 10px; font-weight: 800; letter-spacing: .12em; color: #A79E90">WR</span></span><span style="font-size: 13px; color: #BDB5A9">14.1</span></label>
      <label style="display: flex; align-items: center; gap: 12px; min-height: 48px; border-bottom: 1px solid rgba(245,240,232,.05); cursor: pointer"><input type="checkbox" checked style="width: 20px; height: 20px; accent-color: #C4933B; margin: 0"><span style="flex: 1; font-size: 14px">Kenneth Walker <span style="font-size: 10px; font-weight: 800; letter-spacing: .12em; color: #A79E90">RB</span></span><span style="font-size: 13px; color: #BDB5A9">12.6</span></label>
      <label style="display: flex; align-items: center; gap: 12px; min-height: 48px; border-bottom: 1px solid rgba(245,240,232,.05); cursor: pointer"><input type="checkbox" style="width: 20px; height: 20px; accent-color: #C4933B; margin: 0"><span style="flex: 1; font-size: 14px">Kyle Pitts <span style="font-size: 10px; font-weight: 800; letter-spacing: .12em; color: #A79E90">TE</span></span><span style="font-size: 13px; color: #BDB5A9">8.8</span></label>
      <div style="display: flex; align-items: center; gap: 12px; min-height: 48px; opacity: .6"><span aria-hidden="true" style="width: 20px; height: 20px; border-radius: 5px; background: #343431"></span><span style="flex: 1; font-size: 14px">Jalen Hurts <span style="font-size: 10px; font-weight: 800; letter-spacing: .12em; color: #A79E90">QB</span></span><span style="font-size: 12px; font-style: italic; color: #BDB5A9">Locked · game started</span></div>
    </div>

    <a href="TradeVerdict.dc.html" style="margin-top: auto; text-align: center; padding: 15px 0; border-radius: 14px; background: #C4933B; color: #14140F; text-decoration: none; font-size: 16px; font-weight: 800">Judge this trade</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
