<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya+Sans:wght@400;500;600;700&family=Alegreya:wght@400;500&display=swap">
  <style>
    body { margin: 0; background: #0A0A0B; }
    a { color: #A67C2E; } a:hover { color: #C49035; }
    .sans { font-family: 'Alegreya Sans', system-ui, sans-serif; }
    .serif { font-family: 'Alegreya', Georgia, serif; }
    .eyebrow { font-size: 12px; font-weight: 500; letter-spacing: 0.12em; text-transform: uppercase; color: #AEAEB2; }
    .chip { font-size: 11px; font-weight: 500; letter-spacing: 0.10em; text-transform: uppercase; }
    .h1 { font-size: 32px; font-weight: 700; color: #F5F0E8; line-height: 1.1; }
    .h2 { font-size: 20px; font-weight: 600; color: #F5F0E8; line-height: 1.25; }
    .h3 { font-size: 16px; font-weight: 600; color: #F5F0E8; }
    .body { font-family: 'Alegreya', Georgia, serif; font-size: 15px; color: #F5F0E8; line-height: 1.5; }
    .small { font-family: 'Alegreya', Georgia, serif; font-size: 13px; color: #AEAEB2; line-height: 1.45; }
    .card { background: #1C1C1E; border: 1px solid #3A3A3C; border-radius: 12px; padding: 24px; }
    .num { font-variant-numeric: tabular-nums; }
  </style>
</helmet>
<div class="sans" style="width: 390px; height: 844px; background: #0A0A0B; display: flex; flex-direction: column; overflow: hidden; position: relative;">
  <!-- Dimmed Command Center behind the sheet -->
  <div style="position: absolute; inset: 0; opacity: 0.32;">
    <div style="height: 54px;"></div>
    <div style="display: flex; align-items: center; gap: 8px; padding: 10px 16px; background: #1C1C1E; border-bottom: 1px solid #2C2C2E;">
      <div class="chip" style="color: #AEAEB2;">Gravediggers &middot; Sleeper &middot; Week 7</div>
    </div>
    <div style="padding: 24px 16px;">
      <div class="eyebrow">The Small Council</div>
      <div class="h1" style="font-size: 34px; margin-top: 4px;">Evening, Justin.</div>
    </div>
  </div>
  <div style="position: absolute; inset: 0; background: #0A0A0B; opacity: 0.55;"></div>

  <!-- Switch sheet - height is content, not a fixed detent -->
  <div style="margin-top: auto; position: relative; background: #1C1C1E; border-top: 1px solid #3A3A3C;
              border-radius: 18px 18px 0 0; padding: 10px 0 34px 0; flex-shrink: 0;">
    <div style="width: 36px; height: 4px; border-radius: 2px; background: #3A3A3C; margin: 0 auto 14px auto;"></div>

    <div style="padding: 0 16px 12px 16px;">
      <div class="eyebrow" style="font-size: 11px;">Your teams</div>
    </div>

    <!-- Provider filter. Only connected providers appear. Opens on All the first time, then remembers. -->
    <div style="margin: 0 16px 4px 16px; padding: 3px; background: #141416; border: 1px solid #2C2C2E;
                border-radius: 9px; display: flex; gap: 3px;">
      <div class="chip" style="flex: 1; text-align: center; padding: 7px 0; border-radius: 7px; background: #2A2118; color: #F5F0E8; border: 1px solid #A67C2E;">All</div>
      <div class="chip" style="flex: 1; text-align: center; padding: 7px 0; border-radius: 7px; background: transparent; color: #8E8E93; border: 1px solid transparent;">ESPN</div>
      <div class="chip" style="flex: 1; text-align: center; padding: 7px 0; border-radius: 7px; background: transparent; color: #8E8E93; border: 1px solid transparent;">Yahoo</div>
      <div class="chip" style="flex: 1; text-align: center; padding: 7px 0; border-radius: 7px; background: transparent; color: #8E8E93; border: 1px solid transparent;">Sleeper</div>
    </div>

    <!-- Favourites first, in the order they were starred. Then everything else. -->
    <div style="padding-top: 6px;">
      <div style="display: flex; align-items: center; gap: 10px; padding: 13px 16px; border-bottom: 1px solid #2C2C2E;">
        <div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px;">
          <div style="display: flex; align-items: center; gap: 7px; min-width: 0;">
            <span class="h3" style="font-size: 15px; color: #F5F0E8; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">Gravediggers</span>
            <span style="display: flex; align-items: center; flex-shrink: 0;"><svg width="15" height="15" viewBox="0 0 24 24" fill="#C7CBD1" stroke="none"><path d="M12 2.6l2.9 5.9 6.5.95-4.7 4.6 1.1 6.45L12 17.45 6.2 20.5l1.1-6.45-4.7-4.6 6.5-.95z"/></svg></span>
          </div>
          <div class="small" style="font-size: 12px; color: #6D6D72;">Sleeper &middot; Slop Bowl</div>
        </div>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#A67C2E" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0;"><polyline points="20 6 9 17 4 12"/></svg>
      </div>
      <div style="display: flex; align-items: center; gap: 10px; padding: 13px 16px; border-bottom: 1px solid #2C2C2E;">
        <div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px;">
          <div style="display: flex; align-items: center; gap: 7px; min-width: 0;">
            <span class="h3" style="font-size: 15px; color: #F5F0E8; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">Fourth &amp; Long</span>
            <span style="display: flex; align-items: center; flex-shrink: 0;"><svg width="15" height="15" viewBox="0 0 24 24" fill="#C7CBD1" stroke="none"><path d="M12 2.6l2.9 5.9 6.5.95-4.7 4.6 1.1 6.45L12 17.45 6.2 20.5l1.1-6.45-4.7-4.6 6.5-.95z"/></svg></span>
          </div>
          <div class="small" style="font-size: 12px; color: #6D6D72;">ESPN &middot; The Office League</div>
        </div>
        
      </div>
      <div style="display: flex; align-items: center; gap: 10px; padding: 13px 16px; border-bottom: 1px solid #2C2C2E;">
        <div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px;">
          <div style="display: flex; align-items: center; gap: 7px; min-width: 0;">
            <span class="h3" style="font-size: 15px; color: #F5F0E8; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">Bone Orchard</span>
            <span style="display: flex; align-items: center; flex-shrink: 0;"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#4A4A4E" stroke-width="1.6" stroke-linejoin="round"><path d="M12 3.4l2.7 5.5 6.05.88-4.38 4.27 1.03 6.02L12 17.2l-5.4 2.87 1.03-6.02L3.25 9.78l6.05-.88z"/></svg></span>
          </div>
          <div class="small" style="font-size: 12px; color: #6D6D72;">Yahoo &middot; Dynasty of Dust</div>
        </div>
        
      </div>
      <div style="display: flex; align-items: center; gap: 10px; padding: 13px 16px; border-bottom: 1px solid #2C2C2E;">
        <div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px;">
          <div style="display: flex; align-items: center; gap: 7px; min-width: 0;">
            <span class="h3" style="font-size: 15px; color: #F5F0E8; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">Money League</span>
            <span style="display: flex; align-items: center; flex-shrink: 0;"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#4A4A4E" stroke-width="1.6" stroke-linejoin="round"><path d="M12 3.4l2.7 5.5 6.05.88-4.38 4.27 1.03 6.02L12 17.2l-5.4 2.87 1.03-6.02L3.25 9.78l6.05-.88z"/></svg></span>
          </div>
          <div class="small" style="font-size: 12px; color: #6D6D72;">Sleeper &middot; unnamed team</div>
        </div>
        
      </div>
      <div style="display: flex; align-items: center; gap: 10px; padding: 13px 16px; ">
        <div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px;">
          <div style="display: flex; align-items: center; gap: 7px; min-width: 0;">
            <span class="h3" style="font-size: 15px; color: #F5F0E8; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">Ghost Runners</span>
            <span style="display: flex; align-items: center; flex-shrink: 0;"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#4A4A4E" stroke-width="1.6" stroke-linejoin="round"><path d="M12 3.4l2.7 5.5 6.05.88-4.38 4.27 1.03 6.02L12 17.2l-5.4 2.87 1.03-6.02L3.25 9.78l6.05-.88z"/></svg></span>
          </div>
          <div class="small" style="font-size: 12px; color: #6D6D72;">ESPN &middot; Sunday Family</div>
        </div>
        
      </div>
    </div>

    <div style="padding: 14px 16px 0 16px;">
      <div style="display: flex; align-items: center; justify-content: center; gap: 6px; padding: 11px 0;
                  border: 1px dashed #2F7D5B; border-radius: 10px; color: #2F7D5B;" class="chip">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#2F7D5B" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>Add league
      </div>
    </div>
  </div>
</div>
</x-dc>
</body>
</html>
