<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0A0A0B"/>
      <stop offset="0.58" stop-color="#191714"/>
      <stop offset="1" stop-color="#0A0A0B"/>
    </linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="24"/></filter>
  </defs>
  <rect width="1280" height="800" fill="url(#bg)"/>
  <ellipse cx="956" cy="313" rx="285" ry="250" fill="#2F7D5B" opacity=".20" filter="url(#glow)"/>
  <ellipse cx="1110" cy="653" rx="330" ry="160" fill="#A67C2E" opacity=".14" filter="url(#glow)"/>
  <rect x="0" y="0" width="1280" height="6" fill="#A67C2E"/>
  <text x="86" y="109" fill="#A67C2E" font-family="Arial, sans-serif" font-size="21" font-weight="700" letter-spacing="5">OMEN ESPN CONNECT</text>
  <text x="86" y="178" fill="#F5F0E8" font-family="Arial, sans-serif" font-size="52" font-weight="800">Connect your</text>
  <text x="86" y="238" fill="#F5F0E8" font-family="Arial, sans-serif" font-size="52" font-weight="800">ESPN league.</text>
  <text x="86" y="298" fill="#F5F0E8" font-family="Arial, sans-serif" font-size="52" font-weight="800">Skip the cookie hunt.</text>
  <text x="86" y="354" fill="#C9D8CE" font-family="Arial, sans-serif" font-size="23">The free helper reads your signed-in session locally,</text>
  <text x="86" y="387" fill="#C9D8CE" font-family="Arial, sans-serif" font-size="23">then lets you review and connect in Omen yourself.</text>
  <g font-family="Arial, sans-serif">
    <circle cx="105" cy="485" r="23" fill="#A67C2E"/><text x="98" y="493" fill="#0A0A0B" font-size="23" font-weight="800">1</text>
    <text x="148" y="493" fill="#F5F0E8" font-size="25" font-weight="700">Open Omen ESPN Connect</text>
    <circle cx="105" cy="556" r="23" fill="#A67C2E"/><text x="98" y="564" fill="#0A0A0B" font-size="23" font-weight="800">2</text>
    <text x="148" y="564" fill="#F5F0E8" font-size="25" font-weight="700">Enter your ESPN League ID</text>
    <circle cx="105" cy="627" r="23" fill="#A67C2E"/><text x="98" y="635" fill="#0A0A0B" font-size="23" font-weight="800">3</text>
    <text x="148" y="635" fill="#F5F0E8" font-size="25" font-weight="700">Fill into Omen, then review</text>
  </g>
  <text x="86" y="741" fill="#AEBFB4" font-family="Arial, sans-serif" font-size="20">Works in Microsoft Edge and Google Chrome • You stay in control</text>
  <rect x="730" y="139" width="455" height="511" rx="18" fill="#F5F0E8" opacity=".10" stroke="#A67C2E" stroke-width="2"/>
</svg>
