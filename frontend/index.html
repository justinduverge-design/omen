    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Omen</title>

    <!-- PWA / Add to Home Screen -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- Modern browsers take the SVG and scale it to whatever the surface needs; the PNGs
         remain for browsers without SVG-favicon support. Order matters: the SVG must come
         first so supporting browsers stop there. -->
    <link rel="icon" type="image/svg+xml" href="/omen-favicon.svg" />
    <link rel="icon" type="image/png" sizes="16x16" href="/omen-favicon-16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/omen-favicon-32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/omen-favicon-180.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Omen" />
    <meta name="theme-color" content="#0A0A0B" />
  </head>

    <script type="module" src="/src/main.jsx"></script>
  </body>
